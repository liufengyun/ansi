name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Jo 0.14.2
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO https://github.com/typescope/jo/releases/download/v0.14.2/jo-0.14.2.tar.gz
          curl -fsSLO https://github.com/typescope/jo/releases/download/v0.14.2/jo-0.14.2.tar.gz.sha256
          sha256sum --check jo-0.14.2.tar.gz.sha256
          tar -xzf jo-0.14.2.tar.gz
          echo "$RUNNER_TEMP/jo-0.14.2/bin" >> "$GITHUB_PATH"
      - name: Run jtest suite
        run: jo run test
      - name: Build release artifacts
        run: jo package
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ansi-package
          path: .build/ansi/release/*
          include-hidden-files: true
          if-no-files-found: error
